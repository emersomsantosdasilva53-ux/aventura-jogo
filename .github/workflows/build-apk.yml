{"name": "Build APK", "on": {"workflow_dispatch": null, "push": null}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "actions/setup-node@v4", "with": {"node-version": "20"}}, {"name": "Montar projeto Android com o jogo", "run": "mkdir -p app/www\ncp \"$(ls *.html | head -1)\" app/www/index.html\ncd app\nnpm init -y\nnpm install @capacitor/core @capacitor/cli @capacitor/android\nnpx cap init \"Aventura\" \"com.aventura.jogo\" --web-dir=www\nnpx cap add android\nnpx cap sync android\n"}, {"name": "Compilar APK", "run": "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true\ncd app/android\nchmod +x gradlew\n./gradlew assembleDebug\n"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "aventura-apk", "path": "app/android/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
